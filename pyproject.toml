[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-update-49"
version = "20261117.1422.3016"
description = "并发更新 GitHub 发布的开源命令行工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
tool-update-49 = "tool_update_49.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_update_49"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
